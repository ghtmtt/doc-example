name: Transifex 🗺

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '**.ui'
      - 'docs/**'

jobs:
  push-plugin-translations:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'ghtmtt'
    steps:
    - uses: actions/checkout@v2

    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Install Python requirements
      run: pip install qgis-plugin-ci

    - name: Push to Transifex
      run: qgis-plugin-ci push-translation ${{ secrets.TRANSIFEX_TOKEN }}

  push-documentation-translations:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'ghtmtt'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install documentation dependencies
        run: pip install -r requirements.txt

      - name: Install sphinx-intl
        run: pip install sphinx-intl

      - name: Extract documentation strings
        run: sphinx-build -b gettext doc docs/locale

      - name: Update English source catalogs
        run: sphinx-intl update -p docs/locale -l en

      - name: Push documentation sources to Transifex
        uses: transifex/cli-action@v2
        with:
          token: ${{ secrets.TRANSIFEX_TOKEN }}
          args: push -s
